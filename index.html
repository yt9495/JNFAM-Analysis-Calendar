<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JNFAM Analysis Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6fb;--white:#fff;--surface2:#f8f9fc;--border:#e4e8f0;--border2:#d0d7e8;
  --accent:#7c3aed;--accent-d:#6d28d9;--accent-l:#f5f3ff;
  --blue:#2563eb;--blue-l:#eff4ff;--green:#16a34a;--green-l:#f0fdf4;--yellow:#d97706;--yellow-l:#fffbeb;
  --red:#dc2626;--red-l:#fef2f2;--cyan:#0891b2;
  --text:#1e2533;--text2:#5a6478;--text3:#9aa3b5;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --shadow-lg:0 4px 20px rgba(0,0,0,.10),0 12px 40px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* HEADER */
.header{background:var(--white);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.06);}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;}
.logo-text{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;}
.logo-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.header-right{display:flex;align-items:center;gap:12px;}
.sync-badge{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);font-size:12px;color:var(--text2);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);}
.sync-dot.connected{background:var(--green);}
.sync-dot.syncing{background:var(--yellow);animation:blink .5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.today-chip{padding:5px 12px;border-radius:20px;background:var(--accent-l);border:1px solid #ddd6fe;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);font-weight:600;}

/* TABS */
.tabs{background:var(--white);border-bottom:1px solid var(--border);padding:0 28px;display:flex;gap:2px;overflow-x:auto;}
.tab{padding:13px 16px;border:none;background:transparent;color:var(--text3);font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab:hover{color:var(--text2);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.main{padding:24px 28px;flex:1;}

/* CONTROLS */
.controls{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
.controls-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.month-nav{display:flex;align-items:center;gap:10px;}
.nav-btn{width:34px;height:34px;border-radius:8px;background:var(--white);border:1px solid var(--border);color:var(--text2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);}
.month-title{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;min-width:140px;}
.seg{display:inline-flex;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:3px;box-shadow:var(--shadow);}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.seg button.on{background:var(--accent);color:#fff;}
.stats-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.stat-chip{display:flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;box-shadow:var(--shadow);}
.stat-val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.legend .lg-title{font-size:11px;color:var(--text3);margin-right:2px;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;color:var(--cc);background:var(--cb);border:1.5px solid transparent;cursor:pointer;user-select:none;white-space:nowrap;}
.pill:hover{border-color:var(--cc);}
.pill.on{border-color:var(--cc);box-shadow:0 0 0 2px var(--cb);}
.pill.off{opacity:.35;}
.pill .n{font-family:'IBM Plex Mono',monospace;font-weight:600;opacity:.8;}

/* CALENDAR */
.calendar{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
.cal-header{display:grid;grid-template-columns:repeat(5,1fr) 0.55fr;background:var(--surface2);border-bottom:1px solid var(--border);}
.cal-dow{padding:10px 0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:1px;color:var(--text3);border-right:1px solid var(--border);}
.cal-dow:last-child{border-right:none;}
.cal-grid{display:grid;grid-template-columns:repeat(5,1fr) 0.55fr;}
.cal-day{min-height:150px;padding:8px 6px 4px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;overflow:hidden;}
.cal-day:nth-child(6n){border-right:none;}
.cal-day:hover{background:var(--accent-l);}
.cal-day.other-month{background:var(--surface2);opacity:.5;}
.cal-day.today{background:#f5f3ff;box-shadow:inset 0 0 0 2px var(--accent);}
.cal-day.weekend-cell{background:var(--surface2);padding:6px 5px;}
.cal-day.holiday{background:#fff1f2;}
.cal-day.holiday .dn{color:var(--red);}
.cal-day.holiday.ga-only{background:#fff7ed;}
.cal-day.holiday.ga-only .dn{color:#c2410c;}
.cal-day.holiday.us-only{background:#fdf2f8;}
.day-num{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;gap:4px;}
.dn{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden;}
.today-label{font-size:9px;background:var(--accent);color:#fff;border-radius:4px;padding:1px 5px;font-weight:700;}
.hol-label{font-family:'Noto Sans KR',sans-serif;font-size:9.5px;font-weight:700;color:var(--red);background:#ffe4e6;border:1px solid #fecdd3;border-radius:4px;padding:0 5px;line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hol-label.ga-only{color:#c2410c;background:#ffedd5;border-color:#fed7aa;}
.hol-label.us-only{background:#fff;border-style:dashed;}
.hb{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:700;color:#fff;border-radius:3px;padding:0 3px;margin-right:3px;line-height:12px;vertical-align:1px;}
.hb.us{background:var(--red);}
.hb.ga{background:#ea580c;}
.hb.est{background:transparent;color:#ea580c;border:1px dashed #ea580c;line-height:10px;}
.weekend-day-label{font-size:9px;font-weight:700;color:var(--text3);margin-bottom:3px;margin-top:6px;padding-top:4px;border-top:1px dashed var(--border);}
.weekend-day-label:first-child{margin-top:0;border-top:none;padding-top:0;}
.weekend-day-label.hol{color:var(--red);}
.load{flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;border-radius:4px;padding:0 5px;line-height:15px;background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.load.mid{background:var(--yellow-l);color:var(--yellow);border-color:#fde68a;}
.load.over{background:var(--red);color:#fff;border-color:var(--red);}

.chip{display:flex;align-items:center;gap:3px;padding:3px 6px;border-radius:4px;font-size:10px;margin-bottom:2px;font-weight:600;white-space:nowrap;overflow:hidden;max-width:100%;color:var(--cc);background:var(--cb);border-left:3px solid var(--cc);}
.chip.small{font-size:9px;padding:2px 4px;}
.chip .tx{overflow:hidden;text-overflow:ellipsis;}
.chip .tag{flex-shrink:0;font-size:9px;font-weight:800;border-radius:3px;padding:0 3px;line-height:13px;background:var(--cc);color:#fff;}
.chip .st{flex-shrink:0;font-size:9px;font-weight:800;border-radius:3px;padding:0 3px;line-height:13px;}
.st.late{background:var(--red);color:#fff;}
.st.urg{background:#f97316;color:#fff;}
.st.inprog{background:var(--blue);color:#fff;}
.st.done{background:var(--green);color:#fff;}
.st.hold{background:#94a3b8;color:#fff;}
.chip.task{border-left-style:solid;background:#fff;border:1px solid var(--border);border-left:3px solid var(--cc);}
.chip.virt{border-left-style:dashed;}
.chip.is-done{opacity:.55;}
.chip.is-done .tx{text-decoration:line-through;}
.chip.is-late{box-shadow:inset 0 0 0 1px var(--red);}
.chip .rp{flex-shrink:0;font-size:9px;opacity:.75;}
.task-more{font-size:10px;color:var(--text3);padding:1px 6px;}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(30,37,51,.4);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.overlay.show{display:flex;}
.modal{background:var(--white);border:1px solid var(--border);border-radius:16px;width:560px;max-width:95vw;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .18s ease;}
.modal.wide{width:880px;}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--white);z-index:2;}
.modal-title{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;}
.modal-sub{font-size:12px;color:var(--text2);margin-top:4px;font-family:'Noto Sans KR',sans-serif;}
.modal-close{background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer;padding:2px 8px;border-radius:6px;line-height:1;}
.modal-close:hover{color:var(--red);background:var(--red-l);}
.modal-body{padding:18px 22px;}
.sec-h{font-size:12px;font-weight:800;color:var(--text2);margin:16px 0 8px;letter-spacing:.3px;}
.sec-h:first-child{margin-top:0;}
.card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;position:relative;}
.card.req{border-left:4px solid var(--cc);cursor:pointer;}
.card.req:hover{border-color:var(--cc);}
.card.task{border-left:4px solid var(--cc);}
.card-title{font-size:14px;font-weight:700;margin-bottom:6px;padding-right:50px;}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.meta-chip{font-size:10.5px;font-family:'IBM Plex Mono',monospace;padding:2px 8px;border-radius:4px;background:var(--white);border:1px solid var(--border);color:var(--text2);}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:4px;color:var(--cc);background:var(--cb);border:1px solid var(--cc);white-space:nowrap;}
.icon-btn{position:absolute;top:9px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:3px 7px;border-radius:5px;}
.icon-btn.del{right:8px;}.icon-btn.edit{right:36px;font-size:13px;}
.icon-btn.del:hover{color:var(--red);background:var(--red-l);}
.icon-btn.edit:hover{color:var(--accent);background:var(--accent-l);}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px;}
.kv div{font-size:12.5px;min-width:0;}
.kv .k{display:block;font-size:10.5px;color:var(--text3);font-weight:700;margin-bottom:1px;}
.kv .v{word-break:break-word;}
.stepper{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 2px;}
.step{flex:1;min-width:80px;border:1.5px solid var(--border);background:var(--white);border-radius:8px;padding:7px 4px;font-size:11.5px;font-weight:700;color:var(--text3);cursor:pointer;text-align:center;font-family:'Noto Sans KR',sans-serif;}
.step:hover{border-color:var(--cc);color:var(--cc);}
.step.past{background:var(--cb);color:var(--cc);border-color:var(--cb);}
.step.cur{background:var(--cc);color:#fff;border-color:var(--cc);}
.step small{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;opacity:.85;margin-top:2px;}

/* TABLES */
.tbl-wrap{overflow-x:auto;background:var(--white);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.tbl th{background:var(--surface2);text-align:left;font-size:11px;font-weight:700;color:var(--text2);padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr.click{cursor:pointer;}
.tbl tr.click:hover td{background:var(--accent-l);}
.tbl td.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
.tbl .muted{color:var(--text3);}
.tbl.mini{font-size:11.5px;}
.tbl.mini td,.tbl.mini th{padding:6px 8px;}
.dday{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;}
.dday.late{color:var(--red)}.dday.soon{color:var(--yellow)}.dday.ok{color:var(--text3)}.dday.done{color:var(--green)}

/* FORMS */
.panel{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px;}
.panel h3{font-size:15px;font-weight:800;margin-bottom:4px;}
.panel .desc{font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.6;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 14px;}
.grid3 .wide{grid-column:1/-1;}
.grid3 .sec{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:5px;margin-top:8px;}
.form-label{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;display:block;}
.inp,.sel{width:100%;background:var(--surface2);border:1.5px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-family:'Noto Sans KR',sans-serif;font-size:13px;outline:none;}
.inp:focus,.sel:focus{border-color:var(--accent);background:var(--white);}
.inp.warn{border-color:#f59e0b;background:#fffbeb;}
.btn{background:var(--accent);color:#fff;font-weight:700;border:none;border-radius:8px;padding:9px 20px;font-family:'Noto Sans KR',sans-serif;font-size:13px;cursor:pointer;}
.btn:hover{background:var(--accent-d);}
.btn:disabled{background:var(--border2);color:var(--text3);cursor:not-allowed;}
.btn.ghost{background:var(--white);color:var(--text2);border:1.5px solid var(--border);}
.btn.ghost:hover{background:var(--surface2);}
.btn.danger{background:var(--white);color:var(--red);border:1.5px solid #fecaca;}
.btn.danger:hover{background:var(--red-l);}
.btn.sm{padding:6px 12px;font-size:12px;}
.btn-row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;}
.drop{border:2px dashed var(--border2);border-radius:12px;padding:26px;text-align:center;color:var(--text2);font-size:13px;cursor:pointer;background:var(--surface2);transition:all .15s;}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-l);color:var(--accent);}
.drop b{color:var(--accent);}
.msgs{margin-top:12px;display:flex;flex-direction:column;gap:5px;}
.msg{font-size:12px;padding:7px 11px;border-radius:7px;line-height:1.5;}
.msg.ok{background:var(--green-l);color:#166534;border:1px solid #bbf7d0;}
.msg.warn{background:var(--yellow-l);color:#92400e;border:1px solid #fde68a;}
.msg.err{background:var(--red-l);color:#991b1b;border:1px solid #fecaca;}
.smp-tbl input,.smp-tbl select{width:100%;border:1px solid var(--border);border-radius:5px;padding:5px 6px;font-size:12px;font-family:'Noto Sans KR',sans-serif;background:var(--white);min-width:60px;}
.smp-tbl input:focus{outline:none;border-color:var(--accent);}
.smp-tbl td{padding:4px 5px;}
.totals{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin-top:10px;}
.totals b{font-family:'IBM Plex Mono',monospace;color:var(--text);}
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.filter-row .sel,.filter-row .inp{width:auto;background:var(--white);box-shadow:var(--shadow);padding:7px 10px;font-size:12px;}
.filter-row .sp{flex:1;}
.dow-pick{display:flex;gap:5px;flex-wrap:wrap;}
.dow-pick label{display:inline-flex;align-items:center;justify-content:center;width:38px;height:34px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text2);user-select:none;}
.dow-pick input{display:none;}
.dow-pick label:has(input:checked){background:var(--accent);border-color:var(--accent);color:#fff;}
.preview{margin-top:10px;font-size:12px;color:var(--text2);background:var(--surface2);border:1px dashed var(--border2);border-radius:8px;padding:9px 12px;line-height:1.7;}
.preview b{color:var(--accent);}
.note{font-size:11.5px;color:var(--text3);line-height:1.7;}
.pattern-tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-l);border:1px solid #ddd6fe;border-radius:4px;padding:1px 6px;}
tr.off td{opacity:.45;}

.loading{display:flex;align-items:center;justify-content:center;padding:60px;gap:12px;color:var(--text3);font-size:13px;}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:700;transform:translateY(60px);opacity:0;transition:all .25s;z-index:999;max-width:90vw;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.error{background:var(--red);}
.empty{text-align:center;padding:40px;color:var(--text3);font-size:13px;}
.empty-icon{font-size:32px;margin-bottom:8px;}
.footer{text-align:center;font-size:10.5px;color:var(--text3);padding:14px 20px 20px;line-height:1.6;}

@media(max-width:768px){
  .header{padding:0 14px;}.main{padding:14px;}.tabs{padding:0 14px;}
  .logo-sub,.today-chip{display:none;}
  .grid3,.kv{grid-template-columns:1fr 1fr;}
  .cal-header,.cal-grid{grid-template-columns:repeat(5,1fr) 0.45fr;}
  .cal-day{min-height:80px;padding:5px 3px;}
}
.lang-tg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px;}
.lang-tg button{border:none;background:transparent;padding:4px 11px;border-radius:16px;font-size:11.5px;font-weight:700;color:var(--text2);cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.lang-tg button.on{background:var(--accent);color:#fff;}
.banner{display:none;background:var(--red-l);color:#991b1b;border-bottom:1px solid #fecaca;padding:10px 28px;font-size:13px;line-height:1.6;}
.banner.show{display:block;}
.banner code{background:#fff;border:1px solid #fecaca;border-radius:4px;padding:0 5px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-mark">AN</div>
    <div>
      <div class="logo-text">JNFAM ANALYSIS CALENDAR</div>
      <div class="logo-sub" data-i18n="app.sub"></div>
    </div>
  </div>
  <div class="header-right">
    <div class="lang-tg" id="langTg"><button data-l="ko" onclick="setLang('ko')">한국어</button><button data-l="en" onclick="setLang('en')">EN</button></div>
    <div class="sync-badge"><div class="sync-dot" id="syncDot"></div><span id="syncText"></span></div>
    <div class="today-chip" id="todayBadge"></div>
  </div>
</div>
<div class="banner" id="banner"></div>

<div class="tabs">
  <button class="tab active" data-tab="calendar" onclick="switchTab('calendar')" data-i18n="tab.calendar"></button>
  <button class="tab" data-tab="list" onclick="switchTab('list')" data-i18n="tab.list"></button>
  <button class="tab" data-tab="register" onclick="switchTab('register')" data-i18n="tab.register"></button>
  <button class="tab" data-tab="pattern" onclick="switchTab('pattern')" data-i18n="tab.pattern"></button>
  <button class="tab" data-tab="settings" onclick="switchTab('settings')" data-i18n="tab.settings"></button>
</div>

<div class="main">

  <!-- ═════ CALENDAR ═════ -->
  <div id="tab-calendar">
    <div class="controls">
      <div class="controls-top">
        <div class="month-nav">
          <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
          <div class="month-title" id="monthTitle"></div>
          <button class="nav-btn" onclick="changeMonth(1)">›</button>
          <button class="btn ghost sm" onclick="goToday()" data-i18n="cal.today"></button>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="note" data-i18n="cal.base"></span>
          <div class="seg" id="baseSeg">
            <button data-b="due" onclick="setBase('due')" data-i18n="cal.baseDue"></button>
            <button data-b="plan" onclick="setBase('plan')" data-i18n="cal.basePlan"></button>
          </div>
        </div>
      </div>
      <div class="stats-row" id="statsRow"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="calendar">
      <div class="cal-header" id="calHeader"></div>
      <div class="cal-grid" id="calGrid"><div class="loading" style="grid-column:1/-1"><div class="spinner"></div><span data-i18n="common.loading"></span></div></div>
    </div>
    <div class="note" style="margin-top:8px" data-i18n-html="cal.loadNote"></div>
  </div>

  <!-- ═════ LIST ═════ -->
  <div id="tab-list" style="display:none">
    <div class="filter-row">
      <input class="inp" id="fText" data-i18n-ph="list.search" oninput="renderList()" style="min-width:240px">
      <select class="sel" id="fStage" onchange="renderList()"></select>
      <select class="sel" id="fCompany" onchange="renderList()"></select>
      <select class="sel" id="fPeriod" onchange="renderList()">
        <option value="open" data-i18n="list.pOpen"></option>
        <option value="month" data-i18n="list.pMonth"></option>
        <option value="last30" data-i18n="list.p30"></option>
        <option value="all" data-i18n="list.pAll"></option>
      </select>
      <span class="sp"></span>
      <button class="btn ghost sm" onclick="downloadCSV()">⬇ CSV</button>
    </div>
    <div class="stats-row" id="listStats" style="margin-bottom:12px"></div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr>
          <th data-i18n="f.reqNo"></th><th data-i18n="f.dept"></th><th data-i18n="list.mat"></th><th class="num" data-i18n="st.smp"></th><th data-i18n="s.items"></th>
          <th data-i18n="list.rec"></th><th data-i18n="list.plan"></th><th data-i18n="list.due"></th><th>D-DAY</th><th data-i18n="f.stage"></th><th data-i18n="list.analyst"></th><th class="num">TAT</th>
        </tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ═════ REGISTER ═════ -->
  <div id="tab-register" style="display:none">
    <div class="panel">
      <h3 data-i18n="imp.title"></h3>
      <p class="desc" data-i18n-html="imp.desc"></p>
      <div class="drop" id="dropZone" onclick="document.getElementById('fileInput').click()" data-i18n-html="imp.drop"></div>
      <input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls" style="display:none" onchange="onFile(this.files[0]);this.value=''">
      <div class="msgs" id="parseMsgs"></div>
    </div>

    <div class="panel">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <h3 id="edTitle"></h3>
        <span class="note" id="edSource"></span>
        <span style="flex:1"></span>
        <button class="btn ghost sm" onclick="resetEditor()" data-i18n="ed.new"></button>
      </div>
      <p class="desc" data-i18n="ed.desc"></p>
      <div class="grid3" id="edGrid"></div>

      <div class="sec-h" style="margin-top:20px;color:var(--accent)" data-i18n="sec.smp"></div>
      <div class="tbl-wrap" style="box-shadow:none">
        <table class="tbl mini smp-tbl">
          <thead><tr><th>#</th><th><span data-i18n="s.id"></span> *</th><th data-i18n="s.mat"></th><th data-i18n="s.lot"></th><th data-i18n="s.cont"></th><th data-i18n="s.vol"></th><th data-i18n="s.qty"></th><th data-i18n="s.sdate"></th><th data-i18n="s.items"></th><th data-i18n="s.pre"></th><th data-i18n="s.rmk"></th><th></th></tr></thead>
          <tbody id="smpBody"></tbody>
        </table>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div class="totals" id="smpTotals"></div>
        <button class="btn ghost sm" onclick="addSampleRow()" style="margin-top:10px" data-i18n="ed.addRow"></button>
      </div>
      <datalist id="dlMat"><option>HF</option><option>HCl</option><option>HNO3</option><option>KOH</option><option>Polysilicon (Surface)</option><option>Polysilicon (Bulk)</option><option>UPW</option><option>Wafer</option><option>Other</option></datalist>
      <datalist id="dlCont"><option>Bottle</option><option>PFA Bottle</option><option>Vinyl bag</option><option>Glass Bottle</option><option>Vial</option><option>Other</option></datalist>
      <datalist id="dlItems"><option>ICP-MS</option></datalist>
      <datalist id="dlAnalyst"></datalist>
      <datalist id="dlInst"></datalist>
      <datalist id="dlCompany"></datalist>

      <div class="btn-row">
        <button class="btn ghost" onclick="resetEditor()" data-i18n="btn.cancel"></button>
        <button class="btn" id="edSaveBtn" onclick="saveRequest()"></button>
      </div>
    </div>
  </div>

  <!-- ═════ PATTERN ═════ -->
  <div id="tab-pattern" style="display:none">
    <div class="panel" style="padding:0;overflow:hidden">
      <div style="display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap">
        <h3 style="margin:0" data-i18n="pt.title"></h3>
        <span class="note" data-i18n="pt.sub"></span>
        <span style="flex:1"></span>
        <button class="btn sm" onclick="openPatternForm()" data-i18n="pt.add"></button>
      </div>
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr><th style="width:46px" data-i18n="pt.use"></th><th data-i18n="pt.work"></th><th data-i18n="tk.cat"></th><th data-i18n="pt.cycle"></th><th data-i18n="tk.worker"></th><th data-i18n="pt.period"></th><th data-i18n="pt.next"></th><th></th></tr></thead>
          <tbody id="patternBody"></tbody>
        </table>
      </div>
    </div>
    <div class="note" style="padding:0 4px" data-i18n-html="pt.notes"></div>
  </div>

  <!-- ═════ SETTINGS ═════ -->
  <div id="tab-settings" style="display:none">
    <div class="panel" style="max-width:640px">
      <h3 data-i18n="set.title"></h3>
      <p class="desc" data-i18n="set.desc"></p>
      <div class="grid3" style="grid-template-columns:1fr 1fr">
        <div><label class="form-label" data-i18n="set.cap"></label><input class="inp" type="number" min="1" id="setCap"></div>
        <div><label class="form-label" data-i18n="set.tat"></label><input class="inp" type="number" min="0" id="setTat" data-i18n-ph="set.tatPh"></div>
        <div class="wide"><label class="form-label" data-i18n="set.analysts"></label><input class="inp" id="setAnalysts" data-i18n-ph="set.analystsPh"></div>
        <div class="wide"><label class="form-label" data-i18n="set.inst"></label><input class="inp" id="setInst" placeholder="ICP-MS"></div>
      </div>
      <div class="btn-row"><button class="btn" onclick="saveSettings()" data-i18n="set.save"></button></div>
      <div class="note" style="margin-top:14px" id="dbInfo"></div>
    </div>
  </div>

</div>

<div class="footer">© 2025–2026 Young Tai Kang. All rights reserved. Unauthorized use, copying, modification, or distribution without the written permission of Young Tai Kang is prohibited.</div>

<!-- DAY MODAL -->
<div class="overlay" id="dayOverlay" onclick="if(event.target===this)closeOv('dayOverlay')">
  <div class="modal">
    <div class="modal-header"><div><div class="modal-title" id="dayTitle"></div><div class="modal-sub" id="daySub"></div></div>
      <button class="modal-close" onclick="closeOv('dayOverlay')">×</button></div>
    <div class="modal-body" id="dayBody"></div>
  </div>
</div>

<!-- REQUEST DETAIL MODAL -->
<div class="overlay" id="reqOverlay" onclick="if(event.target===this)closeOv('reqOverlay')">
  <div class="modal wide">
    <div class="modal-header"><div><div class="modal-title" id="reqTitle"></div><div class="modal-sub" id="reqSub"></div></div>
      <button class="modal-close" onclick="closeOv('reqOverlay')">×</button></div>
    <div class="modal-body" id="reqBody"></div>
  </div>
</div>

<!-- TASK MODAL -->
<div class="overlay" id="taskOverlay" onclick="if(event.target===this)closeOv('taskOverlay')">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="taskFormTitle"></div>
      <button class="modal-close" onclick="closeOv('taskOverlay')">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="tk-key">
      <div class="grid3" style="grid-template-columns:1fr 1fr">
        <div class="wide"><label class="form-label" data-i18n="tk.text"></label><input class="inp" id="tk-text" data-i18n-ph="tk.textPh"></div>
        <div><label class="form-label" data-i18n="tk.date"></label><input class="inp" type="date" id="tk-date"></div>
        <div><label class="form-label" data-i18n="tk.cat"></label><select class="sel" id="tk-cat"></select></div>
        <div><label class="form-label" data-i18n="tk.worker"></label><input class="inp" id="tk-worker" list="dlAnalyst"></div>
        <div><label class="form-label" data-i18n="tk.status"></label><select class="sel" id="tk-status"></select></div>
      </div>
      <div class="btn-row"><button class="btn ghost" onclick="closeOv('taskOverlay')" data-i18n="btn.cancel"></button><button class="btn" onclick="saveTask()" data-i18n="btn.save"></button></div>
    </div>
  </div>
</div>

<!-- PATTERN MODAL -->
<div class="overlay" id="patternOverlay" onclick="if(event.target===this)closeOv('patternOverlay')">
  <div class="modal" style="width:620px">
    <div class="modal-header"><div class="modal-title" id="ptFormTitle"></div>
      <button class="modal-close" onclick="closeOv('patternOverlay')">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="pt-id">
      <div class="grid3" style="grid-template-columns:1fr 1fr">
        <div class="wide"><label class="form-label" data-i18n="tk.text"></label><input class="inp" id="pt-text" data-i18n-ph="pt.textPh" oninput="ptPreview()"></div>
        <div><label class="form-label" data-i18n="tk.cat"></label><select class="sel" id="pt-cat"></select></div>
        <div><label class="form-label" data-i18n="tk.worker"></label><input class="inp" id="pt-worker" list="dlAnalyst"></div>
        <div><label class="form-label" data-i18n="pt.freq"></label>
          <select class="sel" id="pt-freq" onchange="ptFreqUI();ptPreview()"><option value="weekly" data-i18n="pt.weekly"></option><option value="monthly" data-i18n="pt.monthly"></option></select></div>
        <div><label class="form-label" data-i18n="pt.interval"></label><select class="sel" id="pt-interval" onchange="ptPreview()"></select></div>
        <div class="wide" id="pt-weekly-row"><label class="form-label" data-i18n="pt.dow"></label><div class="dow-pick" id="pt-days"></div></div>
        <div class="wide" id="pt-monthly-row" style="display:none"><label class="form-label" data-i18n="pt.mday"></label><select class="sel" id="pt-mday" onchange="ptPreview()"></select></div>
        <div><label class="form-label" data-i18n="pt.start"></label><input class="inp" type="date" id="pt-start" onchange="ptPreview()"></div>
        <div><label class="form-label" data-i18n="pt.end"></label><input class="inp" type="date" id="pt-end" onchange="ptPreview()"></div>
        <div class="wide"><label class="form-label" data-i18n="f.memo"></label><input class="inp" id="pt-memo"></div>
      </div>
      <div class="preview" id="pt-preview"></div>
      <div class="btn-row"><button class="btn ghost" onclick="closeOv('patternOverlay')" data-i18n="btn.cancel"></button><button class="btn" id="ptSaveBtn" onclick="savePattern()" data-i18n="btn.save"></button></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function lsGet(k){ try { return localStorage.getItem(LS+k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(LS+k, v); } catch(e){} }
const $ = id => document.getElementById(id);
const escH = s => String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseD = ds => new Date(ds+'T00:00:00');
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const TODAY = ymd(today);
const diffDays = ds => Math.round((parseD(ds) - today) / 86400000);
const DOW = () => lang==='en' ? ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'] : ['일','월','화','수','목','금','토'];
const LOC = () => lang==='en' ? 'en-US' : 'ko-KR';
const fmtMD = ds => { if(!ds) return '-'; const d=parseD(ds); return `${d.getMonth()+1}/${d.getDate()}(${DOW()[d.getDay()]})`; };
const list = s => String(s||'').split(',').map(x=>x.trim()).filter(Boolean);

function setSync(state){
  syncState = state;
  $('syncDot').className = 'sync-dot ' + (state==='on'?'connected':state==='saving'?'syncing':'');
  $('syncText').textContent = t('sync.'+state);
}
function showToast(msg, err=false){
  const el=$('toast'); el.textContent=msg; el.className='toast'+(err?' error':'')+' show';
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>el.className='toast', 2800);
}
window.closeOv = id => $(id).classList.remove('show');
async function guard(fn, okMsg){
  setSync('saving');
  try { await fn(); if (okMsg) showToast(okMsg); setSync('on'); return true; }
  catch(e){ setSync('on'); showToast(t('t.saveFail', e.message, ROOT), true); return false; }
}

/* ═════════════ 목록 ═════════════ */
function filteredReqs(){
  const q=$('fText').value.trim().toLowerCase(), fs=$('fStage').value, fc=$('fCompany').value, fp=$('fPeriod').value;
  const mk=TODAY.slice(0,7), d30=ymd(addDays(today,-30));
  return reqEntries().filter(([,r]) => {
    if (fs && r.stage!==fs) return false;
    if (fc && r.company!==fc) return false;
    if (fp==='open' && !isOpen(r)) return false;
    if (fp==='month' && !(r.dueDate||'').startsWith(mk)) return false;
    if (fp==='last30' && (r.receivedDate||r.reqDate||'') < d30) return false;
    if (q){ const hay=[r.reqNo,r.company,r.division,r.dept,r.requester,r.po,r.analyst,...(r.samples||[]).flatMap(s=>[s.id,s.mat,s.lot,s.items])].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  }).sort((a,b)=>{ const A=a[1],B=b[1]; return (isOpen(B)-isOpen(A)) || String(A.dueDate||'9999').localeCompare(String(B.dueDate||'9999')); });
}
window.renderList = () => {
  const rows = filteredReqs();
  const done = rows.map(([,r])=>r).filter(isDone), tats=done.map(tat).filter(x=>x!==null);

  $('listStats').innerHTML = [

    [t('st.avgTat'), tats.length?t('days',(tats.reduce((a,b)=>a+b,0)/tats.length).toFixed(1)):'-'], [t('st.ontime'), otN?Math.round(ot/otN*100)+'%':'-'],
  ].map(([l,v])=>`<div class="stat-chip"><span style="color:var(--text3);font-size:11px">${l}</span><span class="stat-val">${v}</span></div>`).join('');
  $('listBody').innerHTML = rows.length ? rows.map(([id,r]) => {
    const dd = r.dueDate ? diffDays(r.dueDate) : null;

window.downloadCSV = () => {

const SMP_COLS = [['id','text',null],['mat','text','dlMat'],['lot','text',null],['cont','text','dlCont'],['vol','number',null],['qty','number',null],['sdate','date',null],['items','text','dlItems'],['pre','sel',null],['rmk','text',null]];
const blankSample = () => ({id:'',mat:'',lot:'',cont:'',vol:'',qty:'',sdate:'',items:'',pre:'N',rmk:''});
function renderSamples(){
  $('smpBody').innerHTML = edSamples.map((s,i)=>`<tr><td class="muted">${i+1}</td>${SMP_COLS.map(([k,ty,dl])=>
    ty==='sel' ? `<td><select onchange="smpSet(${i},'${k}',this.value)"><option${s[k]==='N'?' selected':''}>N</option><option${s[k]==='Y'?' selected':''}>Y</option></select></td>`
    : `<td><input type="${ty}" value="${escH(s[k])}"${dl?` list="${dl}"`:''} oninput="smpSet(${i},'${k}',this.value)"${k==='id'?' style="min-width:110px"':''}></td>`).join('')}
    <td><button class="icon-btn" style="position:static" onclick="delSampleRow(${i})" title="${t('ed.delRow')}">×</button></td></tr>`).join('');
  smpTotals();
}
function smpTotals(){
  const v = edSamples.filter(s=>s.id||s.mat||s.lot);
  $('smpTotals').innerHTML = t('ed.totals', v.length, v.reduce((a,s)=>a+(+s.qty||0),0), v.filter(s=>s.pre==='Y').length, v.reduce((a,s)=>a+(+s.vol||0)*(+s.qty||0),0).toLocaleString());
}
window.smpSet = (i,k,v) => { edSamples[i][k]=v; smpTotals(); };
window.addSampleRow = () => { edSamples.push(blankSample()); renderSamples(); };
window.delSampleRow = i => { edSamples.splice(i,1); if (!edSamples.length) edSamples.push(blankSample()); renderSamples(); };

function nextReqNo(dateStr){
  const d = dateStr ? parseD(dateStr) : today;
  const pre = `AN-${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}-`;
  const n = reqEntries().map(([,r])=>r.reqNo||'').filter(x=>x.startsWith(pre)).map(x=>+x.slice(pre.length)||0);
  return pre + String((n.length?Math.max(...n):0)+1).padStart(3,'0');
}
const findDup = (r, selfId) => reqEntries().find(([id,x]) => id!==selfId && ((r.reqNo && x.reqNo===r.reqNo) || (r.po && x.po===r.po && x.reqDate===r.reqDate && x.requester===r.requester)));
window.saveRequest = async () => {
  const r = {}; ED_KEYS.forEach(k => r[k]=getEd(k));
  r.samples = edSamples.filter(s=>s.id||s.mat||s.lot).map(s=>({...s, id:String(s.id).trim(), vol:s.vol===''?'':+s.vol, qty:s.qty===''?'':+s.qty, pre:s.pre==='Y'?'Y':'N'}));
  if (!r.dueDate){ $('ed-dueDate').classList.add('warn'); showToast(t('t.needDue'), true); return; }
  if (r.samples.some(s=>!s.id)){ showToast(t('t.needId'), true); return; }
  if (!r.samples.length && !confirm(t('c.noSamples'))) return;
  if (!r.reqNo) r.reqNo = nextReqNo(r.receivedDate || r.reqDate);
  const dup = findDup(r, edId);
  if (dup && !confirm(t('c.dup', dup[1].reqNo, deptLabel(dup[1]), dup[1].reqDate||'-'))) return;
  Object.assign(r, edMeta);
  r.updatedAt = new Date().toISOString();
  const prev = edId ? requests[edId] : null;
  r.completedDate = r.stage==='결과발송' ? (prev?.completedDate || TODAY) : null;
  const btn=$('edSaveBtn'); btn.disabled=true;
  const ok = await guard(async () => {
    if (edId) await update(ref(db, ROOT+'/requests/'+edId), {...r, ...(prev?.stage!==r.stage?{[`stageLog/${r.stage}`]:r.updatedAt}:{})});
    else await push(reqRef, {...r, createdAt:r.updatedAt, stageLog:{[r.stage]:r.updatedAt}});
  }, edId ? t('t.reqEdited', r.reqNo) : t('t.reqSaved', r.reqNo));
  btn.disabled=false;
  if (ok){
    const ds=showDate(r)||r.dueDate; resetEditor(); $('parseMsgs').innerHTML='';
    if (ds){ curYear=+ds.slice(0,4); curMonth=+ds.slice(5,7)-1; }
    switchTab('calendar');
  }
};

/* ═════════════ 의뢰서(.xlsx) 파싱 ═════════════ */
/*PARSER_START*/
// 고객 분석 의뢰서(JNFAM_Analysis_Request_Form) 파서
// 셀 주소를 고정하지 않고 '라벨' 위치를 찾아 그 옆(병합 범위 다음 칸) 값을 읽음 → 행 추가·이동에 강함
// 경고는 {c: 코드, a: 인자} 형태로 돌려주고 화면에서 언어별 문구로 바꿈
function parseRequestWorkbook(XLSX, data){
  const wb = XLSX.read(data, {type:'array'});
  const sn = wb.SheetNames.find(n=>/request|의뢰/i.test(n)) || wb.SheetNames[0];
  const ws = wb.Sheets[sn];
  if (!ws || !ws['!ref']) { const e=new Error('EMPTY'); e.code='EMPTY'; throw e; }
  const merges = ws['!merges'] || [];
  const R = XLSX.utils.decode_range(ws['!ref']);
  const cellAt = (r,c) => ws[XLSX.utils.encode_cell({r,c})];
  const txt = (r,c) => { const x=cellAt(r,c); if (!x || x.v==null || x.v==='') return ''; return String(typeof x.v==='string' ? x.v : (x.w ?? x.v)).trim(); };
  const first = s => String(s||'').split(/\r?\n/)[0].trim();
  const mergeOf = (r,c) => merges.find(m=>r>=m.s.r&&r<=m.e.r&&c>=m.s.c&&c<=m.e.c);
  const warnings = [];
  const W = (c,a) => warnings.push({c, a});

  const pad = n => String(n).padStart(2,'0');
  function dateFromCell(x){
    if (!x || x.v==null || x.v==='') return '';
    if (typeof x.v==='number'){
      if (x.v>20000 && x.v<80000){ const d=XLSX.SSF.parse_date_code(x.v); if (d) return `${d.y}-${pad(d.m)}-${pad(d.d)}`; }
      return '';
    }
    if (x.v instanceof Date) return `${x.v.getFullYear()}-${pad(x.v.getMonth()+1)}-${pad(x.v.getDate())}`;
    return dateFromText(String(x.v));
  }
  function dateFromText(s){
    s=String(s||'').trim(); let m;
    if ((m=s.match(/(\d{4})[-./년\s]+(\d{1,2})[-./월\s]+(\d{1,2})/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
    if ((m=s.match(/^(\d{1,2})[-./](\d{1,2})[-./](\d{4})/))) return `${m[3]}-${pad(m[1])}-${pad(m[2])}`;   // 미국식 M/D/YYYY
    if ((m=s.match(/^(\d{1,2})[-./](\d{1,2})[-./](\d{2})$/))) return `20${m[3]}-${pad(m[1])}-${pad(m[2])}`;
    return '';
  }

  const labels = [];
  for (let r=R.s.r; r<=R.e.r; r++) for (let c=R.s.c; c<=R.e.c; c++){
    const x=cellAt(r,c); if (x && typeof x.v==='string' && x.v.trim()) labels.push({r,c,f:first(x.v)});
  }
  const findLabel = (re, nth=0) => labels.filter(l=>re.test(l.f))[nth] || null;
  const valCell = L => { const m=mergeOf(L.r,L.c); return {r:L.r, c:(m?m.e.c:L.c)+1}; };
  const field = (re, opt={}) => {
    const L = findLabel(re, opt.nth||0); if (!L) return '';
    const p = valCell(L), x = cellAt(p.r,p.c);
    let v = opt.date ? dateFromCell(x) : txt(p.r,p.c);
    if (!opt.date && v && labels.some(l=>l.r===p.r&&l.c===p.c) && /\n/.test(String(x.v))) v = '';
    if (/미등록|#N\/A|#REF/i.test(v)) v = '';
    return v;
  };

  if (!findLabel(/^Sample ID/i) && !findLabel(/^Request Date/i)) { const e=new Error('NOT_FORM'); e.code='NOT_FORM'; throw e; }

  const f = {
    reqNo:      field(/^Request No/i),
    reqDate:    field(/^Request Date$/i, {date:true}),
    dueDate:    field(/^Requested Due Date/i, {date:true}),
    site:       field(/^Site/i),
    priority:   field(/^Priority$/i) || field(/^Priority$/i, {nth:1}),
    requester:  field(/^Requester$/i),
    po:         field(/^Customer PO/i),
    email:      field(/^E-?mail$/i),
    phone:      field(/^Phone/i),
    deptKey:    field(/^Select Dept/i),
    company:    field(/^Company$/i),
    dept:       field(/^Department$/i),
    purTeam:    field(/^Purchasing Team/i),
    purContact: field(/^Purchasing Contact/i),
    purEmail:   field(/^Purchasing E-?mail/i),
    delivery:   field(/^Delivery Method/i),
    shipDate:   field(/^Pickup\s*\/\s*Ship Date/i, {date:true}),
    storage:    field(/^Storage Condition/i),
    tracking:   field(/^Tracking No/i),
    address:    field(/^Pickup Address/i),
    hazmat:     field(/^Hazmat/i),
    after:      field(/^After Analysis/i),
    requestedBy:field(/^Requested by/i),
    receivedBy: field(/^Received by/i),
    signDate:   field(/^Date$/i, {date:true}),
    receivedCond: field(/^Received Date/i),
    division:   '',
  };

  // 요청 부서: 'Dept Master' 시트에서 직접 조회 (수식 캐시가 없어도 동작, 공정(Division)도 여기서)
  const dm = wb.Sheets[wb.SheetNames.find(n=>/dept\s*master/i.test(n))];
  if (f.deptKey && dm && dm['!ref']){
    const rows = XLSX.utils.sheet_to_json(dm, {header:1, defval:''});
    // A열(Key)은 수식이라 캐시가 없을 수 있음 → B/C/D(회사/공정/부서)로 키를 다시 만들어 비교
    const norm = s => String(s??'').replace(/\s+/g,' ').trim().toLowerCase();
    const hit = rows.slice(1).find(row => norm(row[0])===norm(f.deptKey) || (row[1] && norm(`${row[1]} / ${row[2]} / ${row[3]}`)===norm(f.deptKey)));
    if (hit){
      const g = i => String(hit[i]??'').trim();
      f.company ||= g(1); f.division = g(2); f.dept ||= g(3); f.purTeam ||= g(4); f.purContact ||= g(5); f.purEmail ||= g(6);
    } else W('deptMissing', [f.deptKey]);
  }
  if (!f.deptKey && !f.company) W('noDept', []);

  const samples = [];
  const H = findLabel(/^Sample ID/i);
  if (H){
    const map = {}, keys = [['no',/^No\.?$/i],['id',/^Sample ID/i],['mat',/^Material/i],['lot',/^Lot/i],['cont',/^Container/i],['vol',/^Volume/i],['qty',/^Qty/i],['sdate',/^Sampling Date/i],['items',/^Analysis Items/i],['pre',/^Pre-?treat/i],['rmk',/^Remarks/i]];
    for (let c=R.s.c; c<=R.e.c; c++){ const h=first(txt(H.r,c)); const k=keys.find(([,re])=>re.test(h)); if (k && map[k[0]]===undefined) map[k[0]]=c; }
    for (let r=H.r+1; r<=R.e.r; r++){
      const a = txt(r, map.no ?? 0);
      if (/^\d+\.\s/.test(a)) break;                // 다음 섹션 ("4. SAMPLE COUNT")
      if (/^ex$/i.test(a)) continue;                // 예시 행 제외
      const g = k => map[k]===undefined ? '' : txt(r, map[k]);
      const s = {id:g('id'), mat:g('mat'), lot:g('lot'), cont:g('cont'), vol:'', qty:'', sdate:'', items:g('items'), pre:'', rmk:g('rmk')};
      if (!s.id && !s.mat && !s.lot) continue;
      const num = k => { const v=map[k]===undefined?null:cellAt(r,map[k])?.v; const n=typeof v==='number'?v:parseFloat(String(v??'').replace(/,/g,'')); return isNaN(n)?'':n; };
      s.vol=num('vol'); s.qty=num('qty');
      s.sdate = map.sdate===undefined ? '' : dateFromCell(cellAt(r,map.sdate));
      const p = g('pre').toUpperCase(); s.pre = /^(Y|YES|O|예)$/.test(p) ? 'Y' : 'N';
      if (!s.id) W('noId', [a||r+1]);
      if (!s.items) W('noItems', [s.id||a]);
      samples.push(s);
    }
  }
  if (!samples.length) W('noSamples', []);
  if (!f.dueDate) W('noDue', []);
  if (f.reqDate && f.dueDate && f.dueDate < f.reqDate) W('dueBeforeReq', []);
  const ids = samples.map(s=>s.id).filter(Boolean), dupIds = ids.filter((x,i)=>ids.indexOf(x)!==i);
  if (dupIds.length) W('dupIds', [[...new Set(dupIds)].join(', ')]);
  return {sheet:sn, fields:f, samples, warnings};
}
/*PARSER_END*/

const dz = $('dropZone');
['dragenter','dragover'].forEach(e=>dz.addEventListener(e, ev=>{ev.preventDefault(); dz.classList.add('over');}));
['dragleave','drop'].forEach(e=>dz.addEventListener(e, ev=>{ev.preventDefault(); dz.classList.remove('over');}));
dz.addEventListener('drop', ev => { const f=ev.dataTransfer.files[0]; if (f) onFile(f); });

window.onFile = async file => {
  if (!file) return;
  const msgs=$('parseMsgs'); msgs.innerHTML = `<div class="msg">${t('imp.reading', escH(file.name))}</div>`;
  if (!window.XLSX){ msgs.innerHTML=`<div class="msg err">${t('imp.noLib')}</div>`; return; }
  try {
    const res = parseRequestWorkbook(window.XLSX, new Uint8Array(await file.arrayBuffer()));
    const f = res.fields;
    const r = {...f, samples:res.samples, source:'import', fileName:file.name, stage:'접수대기', priority: f.priority || PRIORITIES[0]};
    if (r.priority && !PRIORITIES.includes(r.priority)) r.priority = /urgent|긴급/i.test(r.priority) ? PRIORITIES[1] : PRIORITIES[0];
    if (list(settings.instruments).length===1) r.instrument = list(settings.instruments)[0];
    loadEditor(r, null);   // 고객 Request No. 칸은 JNFAM 사용 칸 → 비어 있으면 저장 시 자동 채번
    const warn = res.warnings.map(w => t('w.'+w.c, ...w.a.map(String)));
    const dup = findDup(r, null);
    if (dup) warn.unshift(t('imp.dupReq', dup[1].reqNo, deptLabel(dup[1]), dup[1].reqDate||'-'));
    msgs.innerHTML = `<div class="msg ok">${t('imp.ok', escH(file.name), res.samples.length, escH([f.company,f.division,f.dept].filter(Boolean).join(' · ')||t('imp.noDeptShort')), escH(f.dueDate||t('imp.none')))}</div>` +
      warn.map(w=>`<div class="msg warn">⚠️ ${escH(w)}</div>`).join('');
    if (!f.dueDate) $('ed-dueDate').classList.add('warn');
    $('ed-receivedDate').focus();
  } catch(e){
    msgs.innerHTML = `<div class="msg err">❌ ${escH(file.name)}: ${escH(e.code ? t('e.'+e.code) : e.message)}</div>`;
  }
};

/* ═════════════ 정기 업무 화면 ═════════════ */
function cycleText(p){
  const iv=Math.max(1,+p.interval||1);
  if (p.freq==='monthly'){ const d = p.mday==='last' ? t('pt.last') : t('pt.dayN', p.mday); return iv===1 ? t('pt.cycM', d) : t('pt.cycMn', iv, d); }
  const ds=[1,2,3,4,5,6,0].filter(x=>(p.days||[]).map(Number).includes(x)).map(x=>DOW()[x]).join('·')||'-';
  return iv===1 ? t('pt.cycW', ds) : t('pt.cycWn', iv, ds);
}
function nextOccs(p, n){
  const res=[]; let from=TODAY;
  for (let g=0; g<12&&res.length<n; g++){
    const to=ymd(addDays(parseD(from),120));
    patternOccs(p,from,to).forEach(o=>{ if (res.length<n && !(p.skip&&p.skip[o])) res.push(o); });
    from=ymd(addDays(parseD(to),1));
  }
  return res;
}
window.renderPatterns = () => {
  const L = Object.entries(patterns).filter(([,p])=>p).sort((a,b)=>(CATS.indexOf(CAT(a[1].category))-CATS.indexOf(CAT(b[1].category)))||String(a[1].text).localeCompare(String(b[1].text)));
  $('patternBody').innerHTML = L.length ? L.map(([id,p]) => { const nx=p.active===false?[]:nextOccs(p,1);
    return `<tr class="${p.active===false?'off':''}">
      <td><input type="checkbox" ${p.active!==false?'checked':''} onchange="togglePattern('${id}',this.checked)"></td>
      <td><b>${escH(p.text)}</b>${p.memo?`<div class="note">${escH(p.memo)}</div>`:''}</td><td>${catBadge(p.category)}</td>
      <td style="white-space:nowrap">${escH(cycleText(p))}</td><td>${escH(p.worker||'')}</td>
      <td style="white-space:nowrap" class="mono">${p.start} ~ ${p.end||t('pt.ongoing')}</td><td class="mono">${nx.length?fmtMD(nx[0]):'-'}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" onclick="openPatternForm('${id}')">${t('btn.edit')}</button> <button class="btn danger sm" onclick="deletePattern('${id}')">${t('btn.del')}</button></td></tr>`; }).join('')
    : `<tr><td colspan="8"><div class="empty"><div class="empty-icon">🔁</div>${t('pt.empty')}</div></td></tr>`;
};
window.ptFreqUI = () => {
  const m=$('pt-freq').value==='monthly';
  $('pt-weekly-row').style.display=m?'none':''; $('pt-monthly-row').style.display=m?'':'none';
  const s=$('pt-interval'), cur=s.value||'1';
  s.innerHTML=[1,2,3,4].map(n=>`<option value="${n}">${n===1?t(m?'pt.everyM':'pt.every'):t(m?'pt.nM':'pt.nW', n)}</option>`).join(''); s.value=cur;
};
function readPatternForm(){
  return { text:$('pt-text').value.trim(), category:$('pt-cat').value, worker:$('pt-worker').value.trim(), memo:$('pt-memo').value.trim(),
    freq:$('pt-freq').value, interval:+$('pt-interval').value, days:[...document.querySelectorAll('#pt-days input:checked')].map(i=>+i.value),
    mday:(v=>v==='last'?'last':+v)($('pt-mday').value), start:$('pt-start').value, end:$('pt-end').value||'' };
}
window.ptPreview = () => {
  const p=readPatternForm(), el=$('pt-preview');
  if (!p.start||(p.freq==='weekly'&&!p.days.length)){ el.innerHTML=t('pt.pvHint'); return; }
  const id=$('pt-id').value; if (id&&patterns[id]) p.skip=patterns[id].skip;
  const nx=nextOccs(p,6); el.innerHTML=`<b>${escH(cycleText(p))}</b> · ${t('pt.pvNext')}: `+(nx.length?nx.map(fmtMD).join(', '):t('pt.pvNone'));
};
window.openPatternForm = id => {
  const p=(id&&patterns[id])||{freq:'weekly',interval:1,days:[],mday:1,start:TODAY,end:'',category:'정기분석'};
  $('ptFormTitle').textContent=id?t('pt.editT'):t('pt.addT'); $('pt-id').value=id||'';
  $('pt-text').value=p.text||''; $('pt-cat').innerHTML=catOptions(CAT(p.category).k); $('pt-worker').value=p.worker||''; $('pt-memo').value=p.memo||'';
  $('pt-freq').value=p.freq||'weekly'; ptFreqUI(); $('pt-interval').value=String(p.interval||1);
  document.querySelectorAll('#pt-days input').forEach(i=>i.checked=(p.days||[]).map(Number).includes(+i.value));
  $('pt-mday').value=String(p.mday||1); $('pt-start').value=p.start||TODAY; $('pt-end').value=p.end||'';
  ptPreview(); $('patternOverlay').classList.add('show');
};
window.savePattern = async () => {
  const p=readPatternForm(), id=$('pt-id').value;
  if (!p.text) return showToast(t('t.ptText'), true);
  if (!p.start) return showToast(t('t.ptStart'), true);
  if (p.freq==='weekly'&&!p.days.length) return showToast(t('t.ptDow'), true);
  if (p.end&&p.end<p.start) return showToast(t('t.ptEnd'), true);
  if (p.freq==='weekly') p.mday=null; else p.days=null;
  $('ptSaveBtn').disabled=true;
  const ok = await guard(()=> id ? update(ref(db, ROOT+'/patterns/'+id), {...p, updatedAt:new Date().toISOString()}) : push(patRef, {...p, active:true, createdAt:new Date().toISOString()}), id?t('t.ptEdited'):t('t.ptAdded'));
  $('ptSaveBtn').disabled=false; if (ok) closeOv('patternOverlay');
};
window.togglePattern = (id,on) => guard(()=>update(ref(db, ROOT+'/patterns/'+id), {active:on}), on?t('t.ptOn'):t('t.ptOff'));
window.deletePattern = async id => {
  const p=patterns[id]; if (!p) return;
  if (!confirm(t('c.delPt', p.text))) return;
  await guard(()=>remove(ref(db, ROOT+'/patterns/'+id)), t('t.ptDeleted'));
};

/* ═════════════ 설정 ═════════════ */
function loadSettingsForm(){
  $('setCap').value = settings.capacity ?? ''; $('setTat').value = settings.tatDays ?? '';
  $('setAnalysts').value = settings.analysts||''; $('setInst').value = settings.instruments||'';
}
window.saveSettings = () => guard(()=>set(setRef, {
  capacity: Math.max(1, +$('setCap').value||20), tatDays: Math.max(0, +$('setTat').value||0),
  analysts: list($('setAnalysts').value).join(', '), instruments: list($('setInst').value).join(', '),
}), t('t.setSaved'));

/* ── 시작 ── */
loadSettingsForm();
resetEditor();
setSync('wait');
setLang(lang);
</script>
