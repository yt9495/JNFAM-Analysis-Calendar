window.issueInvoice = async () => {
  const d = draft; if (!d) return;
  const email = String(d.billTo.email||'').trim();
  if (!email){ showToast(t('iv.needEmail'), true); return; }
  const lines = d.lines.filter(l => String(l.desc||'').trim() || +l.price);
  if (!lines.length){ showToast(t('iv.noLines'), true); return; }
  const zero = lines.filter(l => !(+l.price>0)).length;
  if (zero && !confirm(t('iv.zeroPrice', zero))) return;
  const total = linesAmt(lines);
  if (!confirm(t('iv.confirm', `${d.billTo.company} · ${d.billTo.contact||''} <${email}>`, lines.length, money(total)))) return;
  const keys = [...new Set(lines.map(l=>l.lk).filter(Boolean))];
  const yymm = d.date.slice(2,4) + d.date.slice(5,7);
  const prefix = String(bset.prefix||'').replace(/[.#$\[\]\/\s]/g,'-');
  let no = null, conflict = null;
  const btn = $('dIssue'); btn.disabled = true; btn.textContent = t('iv.issuing'); setSync('saving');
  try {
    const res = await runTransaction(billRef, cur => {
      cur = cur || {}; const locks = cur.locks || {};
      const hit = keys.find(k => locks[k]);
      if (hit){ conflict = locks[hit]; return; }            // 중단 (이미 청구됨)
      conflict = null;
      const seqs = cur.seq || {}, n = (+seqs[yymm]||0) + 1;
      no = `${prefix}${yymm}-${String(n).padStart(3,'0')}`;
      const nl = {...locks}; keys.forEach(k => nl[k] = no);
      return {...cur, locks:nl, seq:{...seqs, [yymm]:n}};
    }, {applyLocally:false});
    if (!res.committed){ setSync('on'); showToast(t('iv.conflict', conflict||'?'), true); btn.disabled=false; btn.textContent=t('iv.issue'); return; }
    const inv = {
      no, date:d.date, terms:+d.terms||0, dueDate:dueOf(d.date, d.terms), po:d.po||'', notes:d.notes||'',
      billTo:{...d.billTo, email}, period:d.period, reqNos:d.reqNos,
      lines: lines.map(l => ({desc:l.desc||'', qty:+l.qty||0, unit:l.unit||'', price:r2(l.price), amount:r2((+l.qty||0)*(+l.price||0)), lk:l.lk||'', reqId:l.reqId||'', reqNo:l.reqNo||'', sampleId:l.sampleId||''})),
      samples: (d.samples||[]).filter(x => lines.some(l => l.sampleId===x.sampleId && l.reqNo===x.reqNo)), showDetail: d.showDetail!==false,
      locks: keys, sampleCount: keys.length, total, currency:'USD', status:'issued', issuedAt:new Date().toISOString(),
      seller:{name:bset.seller||'', address:bset.address||'', phone:bset.phone||'', email:bset.email||'', remit:bset.remit||''},
    };
    await set(ref(db, `${ROOT}/invoices/${no}`), inv);
    setSync('on'); showToast(t('iv.issued', no)); closeOv('invOverlay'); draft = null;
    keys.forEach(k => blExcl.delete(k));
    renderBilling();
  } catch(e){
    setSync('on'); showToast(t('iv.fail', e.message), true); btn.disabled=false; btn.textContent=t('iv.issue');
  }
};

    [],['Bill To', b.company||''],['Purchasing Team', b.purTeam||''],['Attn', b.contact||''],['E-mail', b.email||''],[],
    ['#','Description','Request No.','Sample ID','Qty','Unit Price (USD)','Amount (USD)'],
    ...(v.lines||[]).map((l,i)=>[i+1, l.desc, l.reqNo||'', l.sampleId||'', l.qty, l.price, l.amount]),
    ['','','','','','TOTAL', v.total], [], ...(v.notes?[['Notes', v.notes]]:[]), ...(s.remit?[['Remittance', s.remit.replace(/\n/g,', ')]]:[]), ...(v.status==='void'?[['STATUS','VOID']]:[])];
  const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:16},{wch:58},{wch:16},{wch:16},{wch:8},{wch:16},{wch:16}];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Invoice');
  if ((v.samples||[]).length){
    const sd = XLSX.utils.aoa_to_sheet([[`Sample Details — ${v.no}`], [], ['#','Request No.','Sample ID','Material','Lot No.','Tests Performed','Received','Measured','Result Sent'],
      ...v.samples.map((x,i)=>[i+1, x.reqNo, x.sampleId, x.mat, x.lot, x.tests, x.received, x.measured, x.sent])]);
    sd['!cols'] = [{wch:5},{wch:14},{wch:16},{wch:20},{wch:16},{wch:30},{wch:12},{wch:12},{wch:12}];
    XLSX.utils.book_append_sheet(wb, sd, 'Sample Details');
  }
  XLSX.writeFile(wb, `${v.no}.xlsx`);
};
window.mailInv = no => {
  const v=invoices[no]; if (!v) return; const b=v.billTo||{};
  const body = `Dear ${b.contact||'Sir/Madam'},\n\nPlease find attached invoice ${v.no} for analysis services (${v.period?.from||''} ~ ${v.period?.to||''}).\n\nInvoice No.: ${v.no}\nAmount: ${money(v.total)} USD\nDue Date: ${v.dueDate}${v.po?`\nCustomer PO: ${v.po}`:''}\nRequest No.: ${(v.reqNos||[]).join(', ')}${(v.samples||[]).length ? '\n\nSamples:\n' + v.samples.map(x=>`- ${x.sampleId} (${x.mat||'-'}, Lot ${x.lot||'-'}): ${x.tests} / received ${x.received||'-'}, measured ${x.measured||'-'}, result sent ${x.sent||'-'}`).join('\n') : ''}\n\nBest regards,\n${v.seller?.name||''}`;
  location.href = `mailto:${encodeURIComponent(b.email||'')}?subject=${encodeURIComponent(`Invoice ${v.no} - ${v.seller?.name||''} Analysis Services`)}&body=${encodeURIComponent(body)}`;
};

/* ── 단가표 ── */
function renderPrices(){
  const rows = Object.entries(prices).filter(([,p])=>p).sort((a,b)=>[a[1].item,a[1].company,a[1].mat].join('|').localeCompare([b[1].item,b[1].company,b[1].mat].join('|')));
  const rowHtml = (id, p) => `<tr data-id="${escH(id)}">
    <td><input class="cell" data-k="company" value="${escH(p.company||'')}" list="dlCompany"></td><td><input class="cell" data-k="mat" value="${escH(p.mat||'')}" list="dlMat"></td>
    <td><input class="cell" data-k="item" value="${escH(p.item||'')}" list="dlItems"></td>
    <td><select class="cell" data-k="per"><option value="sample"${p.per!=='container'?' selected':''}>${t('pr.perS')}</option><option value="container"${p.per==='container'?' selected':''}>${t('pr.perC')}</option></select></td>
    <td><input class="cell num" data-k="price" type="number" min="0" step="0.01" value="${escH(p.price??'')}" style="width:100px"></td><td><input class="cell" data-k="note" value="${escH(p.note||'')}"></td>
    <td style="white-space:nowrap"><button class="btn sm" onclick="savePrice(this)">${t('btn.save')}</button>${id?` <button class="btn danger sm" onclick="delPrice('${escH(id)}')">${t('btn.del')}</button>`:''}</td></tr>`;
  $('prBody').innerHTML = rows.map(([id,p])=>rowHtml(id,p)).join('') + rowHtml('', {per:'sample', item:'ICP-MS'});
}
const rowVals = tr => Object.fromEntries([...tr.querySelectorAll('[data-k]')].map(e=>[e.dataset.k, e.value.trim()]));
window.savePrice = async btn => {
  const tr = btn.closest('tr'), v = rowVals(tr), id = tr.dataset.id;
  if (!v.item || v.price===''){ showToast(t('t.prNeed'), true); return; }
  const p = {company:v.company, mat:v.mat, item:v.item, per:v.per==='container'?'container':'sample', price:r2(v.price), note:v.note, updatedAt:new Date().toISOString()};
  await guard(()=> id ? set(ref(db, `${ROOT}/prices/${id}`), p) : push(prRef, p), t('t.prSaved'));
};
window.delPrice = async id => { if (!confirm(t('c.prDel'))) return; await guard(()=>remove(ref(db, `${ROOT}/prices/${id}`)), t('t.deleted')); };

/* ── 청구 담당자 ── */
function ctUsage(){
  const n = {};
  reqEntries().forEach(([id,r]) => (r.samples||[]).forEach(s => { if (!s || lockOf(id,s)) return; const k = billOf(r,s).key; if (k) n[k]=(n[k]||0)+1; }));
  return n;
}
function renderContacts(){
  const use = ctUsage();
  const rows = Object.entries(contacts).filter(([,c])=>c).sort((a,b)=>ctLabelFull(a[1]).localeCompare(ctLabelFull(b[1])));
  const rowHtml = (id, c) => `<tr data-id="${escH(id)}">${['company','division','dept','purTeam','contact','email','note'].map(k=>`<td><input class="cell" data-k="${k}" value="${escH(c[k]||'')}"${k==='company'?' list="dlCompany"':''}${k==='email'?' type="email" style="min-width:190px"':''}></td>`).join('')}
    <td class="num">${id?(use[id]||0):''}</td>
    <td style="white-space:nowrap"><button class="btn sm" onclick="saveContact(this)">${t('btn.save')}</button>${id?` <button class="btn danger sm" onclick="delContact('${escH(id)}')">${t('btn.del')}</button>`:''}</td></tr>`;
  $('ctBody').innerHTML = rows.map(([id,c])=>rowHtml(id,c)).join('') + rowHtml('', {});
}
window.saveContact = async btn => {
  const tr = btn.closest('tr'), v = rowVals(tr), id = tr.dataset.id;
  if (!v.company || !v.email){ showToast(t('t.ctNeed'), true); return; }
  const k = ctKey(v);
  if (k!==id && contacts[k]){ showToast(t('t.ctDup'), true); return; }
  const c = {...v, updatedAt:new Date().toISOString()};
  await guard(async () => {
    if (!id || id===k) { await update(ref(db, `${ROOT}/contacts/${k}`), c); return; }
    // 키가 바뀜(회사·공정·부서·구매팀 수정) → 새 키로 옮기고, 이 담당자를 지정한 미청구 샘플도 새 키로
    const ch = {[`contacts/${k}`]:c, [`contacts/${id}`]:null};
    reqEntries().forEach(([rid,r]) => (r.samples||[]).forEach((s,i) => { if (s && s.billKey===id && !lockOf(rid,s)) ch[`requests/${rid}/samples/${i}/billKey`] = k; }));
    await update(ref(db, ROOT), ch);
  }, t('t.ctSaved'));
};
window.delContact = async id => {
  const c = contacts[id]; if (!c) return; const n = ctUsage()[id]||0;
  if (n){ showToast(t('t.ctInUse', n), true); return; }
  if (!confirm(t('c.ctDel', ctLabelFull(c)))) return;
  await guard(()=>remove(ref(db, `${ROOT}/contacts/${id}`)), t('t.deleted'));
};
window.collectContacts = async () => {
  const add = {};
  reqEntries().forEach(([,r]) => {
    if (!r.company || !r.purEmail) return;
    const c = {company:r.company, division:r.division||'', dept:r.dept||'', purTeam:r.purTeam||'', contact:r.purContact||'', email:r.purEmail||'', note:'from requests'};
    const k = ctKey(c); if (!contacts[k] && !add[k]) add[k] = c;
  });
  const n = Object.keys(add).length;
  if (n) await guard(()=>update(ctRef, add), t('t.ctCollected', n)); else showToast(t('t.ctCollected', 0));
};

/* ── 청구 설정 ── */
function loadBsForm(){
  if (!$('bsPrefix')) return;
  $('bsPrefix').value=bset.prefix||''; $('bsTerms').value=bset.terms??''; $('bsPre').value=bset.pretreat??''; $('bsUrg').value=bset.urgentPct??'';
  $('bsByPo').checked=bset.byPo!==false; $('bsSeller').value=bset.seller||''; $('bsAddr').value=bset.address||''; $('bsPhone').value=bset.phone||''; $('bsEmail').value=bset.email||''; $('bsRemit').value=bset.remit||'';
}
window.saveBset = () => guard(()=>set(bsRef, {
  prefix: $('bsPrefix').value.trim().replace(/[.#$\[\]\/\s]/g,'-'), terms: Math.max(0, +$('bsTerms').value||0), pretreat: Math.max(0, +$('bsPre').value||0), urgentPct: Math.max(0, +$('bsUrg').value||0),
  byPo: $('bsByPo').checked, seller: $('bsSeller').value.trim(), address: $('bsAddr').value.trim(), phone: $('bsPhone').value.trim(), email: $('bsEmail').value.trim(), remit: $('bsRemit').value.trim(),
}), t('t.bsSaved'));
